<svg width="300" height="300" viewBox="0 0 300 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="envGrad" x1="40" y1="80" x2="240" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EEF2FF" />
      <stop offset="100%" stop-color="#E0E7FF" />
    </linearGradient>
    <linearGradient id="flapGrad" x1="40" y1="80" x2="220" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="glassGrad" x1="140" y1="130" x2="260" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  <!-- Envelope Shadow & Base -->
  <rect x="40" y="90" width="200" height="140" rx="16" fill="url(#envGrad)" stroke="#C7D2FE" stroke-width="3"/>
  <path d="M40 95 L140 170 L240 95" stroke="#818CF8" stroke-width="4" stroke-linecap="round"/>
  <path d="M40 225 L105 155" stroke="#C7D2FE" stroke-width="3" stroke-linecap="round"/>
  <path d="M240 225 L175 155" stroke="#C7D2FE" stroke-width="3" stroke-linecap="round"/>

  <!-- Magnifying Glass with AI Scanner Indicator -->
  <circle cx="185" cy="175" r="48" fill="url(#glassGrad)" stroke="#4F46E5" stroke-width="6"/>
  <circle cx="185" cy="175" r="38" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="220" y1="210" x2="265" y2="255" stroke="#312E81" stroke-width="12" stroke-linecap="round"/>
  <line x1="220" y1="210" x2="265" y2="255" stroke="#6366F1" stroke-width="6" stroke-linecap="round"/>

  <!-- Scanning crosshair -->
  <path d="M175 175 H195 M185 165 V185" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <!-- Warning badge -->
  <circle cx="90" cy="80" r="18" fill="#DC2626"/>
  <text x="90" y="86" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="bold" font-size="18">!</text>
</svg>
