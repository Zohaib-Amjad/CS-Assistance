<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shieldGrad" x1="50" y1="50" x2="350" y2="350" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="200" y1="50" x2="200" y2="350" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0.2" />
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="400" height="400" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#4F46E5" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="coreGlow" x1="150" y1="120" x2="250" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
  </defs>
  <!-- Outer Glow Backdrop -->
  <circle cx="200" cy="200" r="140" fill="url(#shieldGrad)" opacity="0.15" filter="blur(30px)"/>
  
  <!-- Main Shield Body -->
  <path d="M200 60 C270 60 310 90 310 170 C310 260 230 315 200 340 C170 315 90 260 90 170 C90 90 130 60 200 60 Z" 
        fill="url(#shieldGrad)" filter="url(#shadow)" stroke="rgba(255,255,255,0.4)" stroke-width="4"/>
  
  <!-- Inner Glass Shield -->
  <path d="M200 80 C255 80 288 105 288 170 C288 245 224 292 200 312 C176 292 112 245 112 170 C112 105 145 80 200 80 Z" 
        fill="url(#glowGrad)" fill-opacity="0.3" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>
        
  <!-- Circuit Nodes & Lines -->
  <path d="M150 170 L200 130 L250 170 L200 240 Z" stroke="url(#coreGlow)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="rgba(255,255,255,0.1)"/>
  <circle cx="200" cy="130" r="7" fill="#67E8F9"/>
  <circle cx="150" cy="170" r="7" fill="#818CF8"/>
  <circle cx="250" cy="170" r="7" fill="#C084FC"/>
  <circle cx="200" cy="240" r="7" fill="#38BDF8"/>
  <circle cx="200" cy="185" r="12" fill="#FFFFFF" opacity="0.9"/>
  <path d="M195 185 L199 189 L206 182" stroke="#4F46E5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
